# Alembic configuration. The database URL comes from DATABASE_URL or the
# MYSQL_* / DB_HOST variables (see models/engine/db_storage.py).
#   alembic upgrade head        apply all migrations
#   alembic downgrade -1        revert the latest migration
#   alembic revision --autogenerate -m "describe change"
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
