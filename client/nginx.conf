# Clinema web server. ${API_UPSTREAM} and ${NGINX_RESOLVER} are substituted
# at container start (envsubst via the image entrypoint).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Re-resolve the API host periodically so a recreated API container
    # (new IP) doesn't break the proxy.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://image.tmdb.org https://openweathermap.org https://avatars.githubusercontent.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }

    # Hashed build assets never change: cache for a year
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated
    location = /index.html {
        expires -1;
    }

    # Client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
